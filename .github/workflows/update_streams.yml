name: "IPTV Multi-Agent Autopilot"

on:
  schedule:
    # Exécution automatique toutes les 12 heures (00:00 et 12:00 UTC)
    - cron: '0 */12 * * *'
  workflow_dispatch:
    # Déclenchement manuel en 1 clic depuis l'interface GitHub

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "iptv-pipeline"
  cancel-in-progress: true

jobs:
  run-agents:
    name: "🤖 Exécution des 3 Agents (Scraper, Audit, Déploiement)"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: "📥 Cloner le dépôt"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "🐍 Installer Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "📦 Installer les dépendances"
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: "🚀 Lancer le pipeline multi-agents"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONCURRENCY: 40
          PAGES_BASE_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
        run: |
          python run_pipeline.py

      - name: "💾 Sauvegarder les listes sur le dépôt"
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlists/ AUDIT_REPORT.md index.html web/
          if git diff --staged --quiet; then
            echo "Aucun changement détecté dans les flux."
          else
            git commit -m "🤖 [Autopilot] Actualisation automatique des flux IPTV (100% testés)"
            git push origin main
          fi

      - name: "🌐 Déployer sur GitHub Pages"
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          keep_files: true
          publish_branch: gh-pages
